# /etc/nginx/conf.d/do-ai-proxy.conf
# Generated by install.sh — do not edit manually.
# Mode: HTTP (no SSL)

server {
    listen __PORT__;
    server_name _;

    # Allow large request bodies (AI prompts with long context can be big)
    client_max_body_size 0;

    # Strip all headers that could reveal the real client IP / location
    proxy_set_header  CF-Connecting-IP    "";
    proxy_set_header  CF-Connecting-IPv6  "";
    proxy_set_header  CF-IPCountry        "";
    proxy_set_header  CF-IPCity           "";
    proxy_set_header  CF-IPContinent      "";
    proxy_set_header  CF-IPLongitude      "";
    proxy_set_header  CF-IPLatitude       "";
    proxy_set_header  CF-Region           "";
    proxy_set_header  CF-Region-Code      "";
    proxy_set_header  CF-Timezone         "";
    proxy_set_header  X-Forwarded-For     "";
    proxy_set_header  X-Real-IP           "";
    proxy_set_header  True-Client-IP      "";
    proxy_set_header  Forwarded           "";
    proxy_set_header  Host                "inference.do-ai.run";

    # Validate the proxy secret sent by the client
    set $auth_ok 0;
    if ($http_x_proxy_secret = "__PROXY_SECRET__") {
        set $auth_ok 1;
    }
    if ($auth_ok = 0) {
        return 401 '{"error":"Unauthorized"}';
    }
    # Remove the secret header before forwarding upstream
    proxy_set_header  X-Proxy-Secret      "";

    location / {
        proxy_pass            https://inference.do-ai.run;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";

        # Inject the DO API key inside location so it always overrides
        # any Authorization header sent by the client
        proxy_set_header      Authorization     "Bearer __DO_API_KEY__";

        # Use system CA bundle to verify DO's certificate
        proxy_ssl_verify          on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name     on;
        proxy_ssl_name            inference.do-ai.run;

        # Streaming / SSE support
        proxy_buffering             off;
        proxy_cache                 off;
        proxy_read_timeout          600s;
        proxy_connect_timeout       10s;
        proxy_send_timeout          600s;
        chunked_transfer_encoding   on;
    }
}
